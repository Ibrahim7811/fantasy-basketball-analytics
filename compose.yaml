services:
  api:
    build: .
    image: fantasy-basketball-api
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      FANTASY_DB_PATH: /data/fantasy_basketball.db
      FANTASY_MODEL_DIR: /models
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./models/32_players_3_features
        target: /models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: fantasy_basketball
      POSTGRES_USER: fantasy_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_app -d fantasy_basketball"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
volumes:
  postgres_data: