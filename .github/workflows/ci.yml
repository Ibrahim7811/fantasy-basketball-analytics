name: Tests and Docker Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: fantasy_test
          POSTGRES_USER: fantasy_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantasy_app -d fantasy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run tests including PostgreSQL integration
        env:
          TEST_POSTGRES_URL: postgresql://fantasy_app:ci_test_password@127.0.0.1:5432/fantasy_test
        run: python -m pytest -q --tb=short -rs

      - name: Build Docker image
        run: docker build -t fantasy-basketball-api:ci .

      - name: Start API container
        run: |
          docker run -d --name api-ci \
            -p 127.0.0.1:8000:8000 \
            fantasy-basketball-api:ci

      - name: Check container health endpoint
        timeout-minutes: 2
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 2 \
            --retry-max-time 90 --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8000/health

      - name: Show container logs
        if: always()
        run: docker logs api-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f api-ci || true