name: Tests and Docker Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run tests
        run: python -m pytest -q --tb=short

      - name: Build Docker image
        run: docker build -t fantasy-basketball-api:ci .

      - name: Start API container
        run: |
          docker run -d --name api-ci \
            -p 127.0.0.1:8000:8000 \
            fantasy-basketball-api:ci

      - name: Check container health endpoint
        timeout-minutes: 2
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 2 \
            --retry-max-time 90 --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8000/health

      - name: Show container logs
        if: always()
        run: docker logs api-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f api-ci || true